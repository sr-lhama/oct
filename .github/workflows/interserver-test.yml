name: Test InterServer FTPS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify encrypted connection and document root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib, ssl, os
          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30) as ftp:
              ftp.connect(os.environ["FTP_SERVER"], 21)
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              ftp.prot_p()
              names = ftp.nlst()
              expected = "dashboard.html" if os.environ["GITHUB_REPOSITORY"].endswith("/oct-auth-preview") else "index.html"
              if expected not in [n.rsplit("/",1)[-1] for n in names]:
                  raise RuntimeError("Expected document root not found")
              print("FTPS certificate, authentication and document root verified. No files changed.")
          PY
