name: Publish OCT page and garment updates to InterServer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-garment-preview.yml'
      - 'scripts/build-public-site.py'
      - 'scripts/publish-public-site.py'
      - 'scripts/public-site.htaccess'
      - 'assets/fonts/**'
      - 'assets/images/logo-card.webp'
      - 'assets/images/logo-header-animated.webp'
      - 'assets/images/orlando-custom-tees-share.jpg'
      - '*.html'
      - 'robots.txt'
      - 'css/site.css'
      - 'js/site.js'
      - 'js/language.js'
      - 'quote.html'
      - 'product.html'
      - '404.html'
      - 'birthday-shirts-orlando.html'
      - 'assets/page-banners/oct-birthday-crew.webp'
      - 'assets/page-banners/oct-disney-family-2027.webp'
      - 'customer.html'
      - 'dtf-printing.html'
      - 'css/dtf-page.css'
      - 'assets/page-banners/oct-dtf-hero.webp'
      - 'assets/page-banners/oct-dtf-process.webp'
      - 'assets/page-banners/oct-dtf-detail.webp'
      - 'faq.html'
      - 'privacy.html'
      - 'services.html'
      - 'terms.html'
      - 'css/page-refresh.css'
      - 'assets/images/brand-gildan.webp'
      - 'assets/images/brand-nextlevel.webp'
      - 'assets/page-banners/sr-lhama-lost.webp'
      - 'assets/page-banners/sr-lhama-privacy.webp'
      - 'assets/page-banners/sr-lhama-terms.webp'
      - 'js/product-banner.js'
      - 'js/locale-es.json'
      - 'js/locale-pt.json'
      - 'css/quote-artwork.css'
      - 'js/artwork.js'
      - 'js/quote-print-positions.js'
      - 'js/garment-catalog.js'
      - 'js/gildan-64000.js'
      - 'js/quote-site.js'
permissions:
  contents: read
concurrency:
  group: oct-interserver-garment-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish page and garment files over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib
          import io
          import re
          import os
          import ssl
          from pathlib import Path

          files = [
              "css/quote-artwork.css", "js/quote-print-positions.js",
              "js/artwork.js", "js/garment-catalog.js",
              "js/gildan-64000.js", "js/quote-site.js",
              "css/page-refresh.css", "js/product-banner.js", "js/locale-es.json", "js/locale-pt.json",
              "assets/images/brand-gildan.webp",
              "assets/images/brand-nextlevel.webp",
              "assets/page-banners/sr-lhama-lost.webp",
              "assets/page-banners/sr-lhama-privacy.webp",
              "assets/page-banners/sr-lhama-terms.webp",
              "css/dtf-page.css",
              "assets/page-banners/oct-dtf-hero.webp",
              "assets/page-banners/oct-dtf-process.webp",
              "assets/page-banners/oct-dtf-detail.webp",
              "assets/page-banners/oct-birthday-crew.webp",
              "assets/page-banners/oct-disney-family-2027.webp",
              "birthday-shirts-orlando.html", "customer.html", "dtf-printing.html", "faq.html",
              "privacy.html", "services.html", "terms.html", "404.html", "product.html", "quote.html",
          ]

          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30) as ftp:
              ftp.connect(os.environ["FTP_SERVER"], 21)
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              ftp.prot_p()
              for existing in ("index.html", "quote.html", "product.html", "css/site.css"):
                  ftp.size(existing)
              staged = [(path, path + ".upload-" + os.environ["GITHUB_RUN_ID"]) for path in files]
              for path, temp in staged:
                  with Path(path).open("rb") as source:
                      ftp.storbinary("STOR " + temp, source)
              for path, temp in staged:
                  ftp.rename(temp, path)
                  print("Published " + path)

              # Keep the host's existing directives and install a local error document.
              config = io.BytesIO()
              try:
                  ftp.retrbinary("RETR .htaccess", config.write)
              except ftplib.error_perm as error:
                  if not str(error).startswith("550") or ".htaccess" in {
                      item.rsplit("/", 1)[-1] for item in ftp.nlst("-a")
                  }:
                      raise
              current = config.getvalue()
              directives = re.findall(rb"(?im)^\s*ErrorDocument[ \t]+404[ \t]+([^\r\n]+)", current)
              if not directives or directives[-1].strip() != b"/404.html":
                  updated = current + (b"\n" if current and not current.endswith(b"\n") else b"")
                  updated += b"ErrorDocument 404 /404.html\n"
                  temp = ".htaccess.upload-" + os.environ["GITHUB_RUN_ID"]
                  ftp.storbinary("STOR " + temp, io.BytesIO(updated))
                  ftp.rename(temp, ".htaccess")
                  print("Configured the branded 404 error document")
          PY

      - name: Build crawlable public pages
        run: |
          python -m pip install 'lxml==6.1.1'
          python scripts/build-public-site.py "$RUNNER_TEMP/oct-public" --revision "$GITHUB_SHA"
      - name: Publish canonical products and languages
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/publish-public-site.py "$RUNNER_TEMP/oct-public"
