const dollar=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
function addBusinessDays(start,days){
 const d=new Date(start);
 d.setUTCHours(12,0,0,0);
 let remaining=days;
 while(remaining>0){d.setUTCDate(d.getUTCDate()+1);if(d.getUTCDay()!==0&&d.getUTCDay()!==6)remaining--}
 return d.toISOString().slice(0,10);
}
function remainingBusinessDays(dueDate){
 if(!dueDate)return null;
 const today=new Date();today.setUTCHours(12,0,0,0);
 const due=new Date(dueDate+"T12:00:00Z");
 if(!Number.isFinite(+due))return null;
 let days=0;
 if(due>=today){for(let d=new Date(today);d<due;){d.setUTCDate(d.getUTCDate()+1);if(d.getUTCDay()!==0&&d.getUTCDay()!==6)days++}}
 else{for(let d=new Date(due);d<today;){d.setUTCDate(d.getUTCDate()+1);if(d.getUTCDay()!==0&&d.getUTCDay()!==6)days--}}
 return due>=today?days:-days;
}

const formatValue=(key,value)=>{
 if(value===null||value===undefined||value==="")return "—";
 if(["total","amount","subtotal","tax","shipping","unit_price"].includes(key))return dollar.format(Number(value));
 if(typeof value==="boolean")return value?"Yes":"No";
 if(key==="due_date"||key.endsWith("_at")){const d=new Date(value);return Number.isNaN(+d)?safe(value):safe(d.toLocaleDateString("en-US",{timeZone:"UTC"}))}
 return safe(value);
};

function fieldInput(field,value,lookup){
 const [name,title,type,required]=field;
 const id="f-"+name;const val=value??"";
 const prefix='<label style="display:block;font-size:12px;font-weight:600;margin:11px 0 5px" for="'+id+'">'+safe(title)+(required?" *":"")+'</label>';
 const common=' id="'+id+'" name="'+name+'" '+(required?"required":"")+' style="width:100%;padding:11px;border:1px solid #d6dfeb;border-radius:8px;background:white;color:#15243a" ';
 if(type==="textarea")return prefix+'<textarea '+common+' rows="3">'+safe(val)+'</textarea>';
 if(type==="checkbox")return prefix+'<input type="checkbox" name="'+name+'" id="'+id+'" '+(val?"checked":"")+' style="width:20px;height:20px">';
 if(type.startsWith("select:")){
 const opts=type.slice(7).split("|");
 return prefix+'<select '+common+'>'+opts.map(x=>'<option value="'+safe(x)+'" '+(x===val?"selected":"")+'>'+safe(x.replaceAll("_"," "))+'</option>').join("")+'</select>';
 }
 if(["customers","orders","estimates"].includes(type)){
 const choices=lookup[type]||[];
 return prefix+'<select '+common+'><option value="">Select...</option>'+choices.map(x=>{
 let label=type==="customers"?(x.company||x.name):(type==="orders"?(x.order_number||x.id):(x.estimate_number||x.id));
 return '<option value="'+safe(x.id)+'" '+(x.id===val?"selected":"")+'>'+safe(label)+'</option>';
 }).join("")+'</select>';
 }
 const number=(type==="number"||type==="integer");
 return prefix+'<input '+common+' type="'+type+'" '+(number?'min="0" step="'+(type==="integer"?"1":"0.01")+'"':"")+' value="'+safe(type==="datetime-local"&&val?String(val).slice(0,16):val)+'">';
}
async function getLookup(){
 const pairs=[["customers","id,name,company"],["orders","id,order_number"],["estimates","id,estimate_number"]];
 const entries=await Promise.all(pairs.map(async ([name,cols])=>{
 const {data,error}=await client.from(name).select(cols).order("created_at",{ascending:false}).limit(500);
 return [name,error?[]:(data||[])];
 }));
 return Object.fromEntries(entries);
}

async function showEditor(page,existing){
 const cfg=registry[page];if(!cfg||!cfg.fields.length)return;
 const lookup=await getLookup();
 closeEditor();
 const overlay=document.createElement("div");overlay.id="recordEditor";overlay.style.cssText="position:fixed;inset:0;z-index:200;background:#091a35b5;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto";
 const box=document.createElement("section");box.style.cssText="background:#fff;border-radius:16px;padding:25px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px #091a3535";
 box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:21px;margin:0">'+(existing?"Edit":"Add")+" "+safe(page==="items"?"order item":page==="production"?"production record":page.slice(0,-1))+'</h2><button type="button" id="dismiss" class="btn secondary">Close</button></div>'+
 '<p style="color:#64748b;font-size:13px">All changes are stored in Supabase. Do not mark PayPal payments as verified here.</p>'+
 '<form id="entryForm">'+cfg.fields.map(f=>fieldInput(f,existing?.[f[0]],lookup)).join("")+(page==="artwork"?'<label style="display:block;margin-top:12px;font-weight:bold;font-size:13px">Private artwork file (PNG, JPEG, WebP, PDF; max 20MB)</label><input type="file" id="artworkFile" accept="image/png,image/jpeg,image/webp,application/pdf" style="margin:10px 0;max-width:100%">':'')+
 '<div style="display:flex;gap:9px;margin-top:20px"><button class="btn" type="submit">Save record</button><button class="btn secondary" type="button" id="cancelForm">Cancel</button></div><div id="formMessage" role="status"></div></form>';
 overlay.append(box);document.body.append(overlay);
 const exit=()=>closeEditor();
 box.querySelector("#dismiss").onclick=exit;box.querySelector("#cancelForm").onclick=exit;
 overlay.addEventListener("click",e=>{if(e.target===overlay)exit()});
 box.querySelector("form").onsubmit=async e=>{
 e.preventDefault();const form=e.target;const button=form.querySelector('button[type="submit"]');button.disabled=true;
 const payload={};
 for(const [name,,type,required] of cfg.fields){

 payload[name]=value;
 }

  if(!payload.due_date&&!existing?.due_date)payload.due_date=addBusinessDays(new Date(),7);
 }
 let newUploadPath=null;
 if(page==="artwork"){
  const input=form.querySelector("#artworkFile");
  if(input?.files?.length){
   const file=input.files[0];
   if(!["image/png","image/jpeg","image/webp","application/pdf"].includes(file.type)||file.size>20*1024*1024){

   }
   if(!payload.order_id && !existing?.order_id){alertIn(box,"Select an order before uploading artwork.",true);button.disabled=false;return}
   const folder=payload.order_id||existing.order_id;
   const safeName=file.name.replace(/[^a-zA-Z0-9_.-]/g,"_").slice(-90);
   newUploadPath=folder+"/"+crypto.randomUUID()+"-"+safeName;
   const {error:uploadError}=await client.storage.from("order-artworks").upload(newUploadPath,file,{contentType:file.type,upsert:false});
   if(uploadError){alertIn(box,"Artwork upload failed: "+uploadError.message,true);button.disabled=false;return}
   payload.storage_path=newUploadPath;
  }
 }

function csvEncode(rows){
 if(!rows.length)return "";
 const columns=Object.keys(rows[0]);
 const quote=x=>'"'+String(x??"").replaceAll('"','""')+'"';
 return [columns.map(quote).join(","),...rows.map(row=>columns.map(k=>quote(typeof row[k]==="object"?JSON.stringify(row[k]):row[k])).join(","))].join("\r\n");
}
function downloadFile(filename,contents,type){

}

const EXPECTED_OCT_BACKUP_SHA="9c9f3f2ae8df4010510c81f5a2335a9fee95ae2db4aedc329a36c90c597e696c";
function parseZipDirectory(bytes){
 const view=new DataView(bytes);
 let eocd=-1;
 for(let i=bytes.byteLength-22;i>=Math.max(0,bytes.byteLength-65557);i--){
  if(view.getUint32(i,true)===0x06054b50){eocd=i;break}
 }
 if(eocd<0)throw new Error("Invalid ZIP directory");
 const count=view.getUint16(eocd+10,true),base=view.getUint32(eocd+16,true);
 if(count>2000||base>=bytes.byteLength)throw new Error("Invalid ZIP size");
 let p=base;
 const entries=[];
 for(let i=0;i<count;i++){
  if(view.getUint32(p,true)!==0x02014b50)throw new Error("Invalid ZIP index");
  const method=view.getUint16(p+10,true);
  const packed=view.getUint32(p+20,true),unpacked=view.getUint32(p+24,true);
  const nameLen=view.getUint16(p+28,true),extraLen=view.getUint16(p+30,true),commentLen=view.getUint16(p+32,true);
  const localOffset=view.getUint32(p+42,true);
  const name=new TextDecoder("utf-8").decode(new Uint8Array(bytes,p+46,nameLen));
  entries.push({name,method,packed,unpacked,localOffset});
  p+=46+nameLen+extraLen+commentLen;
 }
 return entries;
}
async function readZipText(bytes,entry){
 if(entry.unpacked>1000000||entry.packed>1000000)throw new Error("JSON entry exceeds safe size");
 const view=new DataView(bytes);
 const at=entry.localOffset;
 if(view.getUint32(at,true)!==0x04034b50)throw new Error("Invalid ZIP file header");
 const start=at+30+view.getUint16(at+26,true)+view.getUint16(at+28,true);
 if(start+entry.packed>bytes.byteLength)throw new Error("Invalid ZIP data boundary");
 const chunk=new Uint8Array(bytes,start,entry.packed);
 let text;
 if(entry.method===0)text=new TextDecoder().decode(chunk);
 else if(entry.method===8){
  if(typeof DecompressionStream!=="function")throw new Error("Your browser does not support ZIP extraction");
  text=await new Response(new Blob([chunk]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
 }else throw new Error("Unsupported ZIP compression");
 if(new TextEncoder().encode(text).length!==entry.unpacked)throw new Error("ZIP size mismatch: "+entry.name);
 return text;
}
async function inspectOctBackup(file,onProgress){
 if(file.size<10000||file.size>150000000)throw new Error("Unexpected backup file size");
 const bytes=await file.arrayBuffer();
 onProgress("Verifying backup signature...");
 const hash=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes))).map(x=>x.toString(16).padStart(2,"0")).join("");
 if(hash!==EXPECTED_OCT_BACKUP_SHA)throw new Error("This ZIP does not match the audited Orlando Custom Tees backup dated November 15, 2026");
 const entries=parseZipDirectory(bytes);
 const archive={};
 for(const entry of entries){
  if(!entry.name.startsWith("oct-backup/dados-original/")||!entry.name.endsWith(".json"))continue;
  onProgress("Reading "+entry.name.split("/").pop()+"...");
  const parsed=JSON.parse(await readZipText(bytes,entry));
  if(!parsed.table||!Array.isArray(parsed.rows))throw new Error("Malformed original backup data");
  if(archive[parsed.table])throw new Error("Duplicate table in backup");
  archive[parsed.table]=parsed.rows;
 }
 const count=Object.values(archive).reduce((n,rows)=>n+rows.length,0);
 if(Object.keys(archive).length!==26||count!==254)throw new Error("Backup record count mismatch");
 return {archive,sha:hash,count};
}
