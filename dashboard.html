const dollar=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
function addBusinessDays(start,days){
 const d=new Date(start);
 d.setUTCHours(12,0,0,0);
 let remaining=days;
 while(remaining>0){d.setUTCDate(d.getUTCDate()+1);if(d.getUTCDay()!==0&&d.getUTCDay()!==6)remaining--}
 return d.toISOString().slice(0,10);
}
function remainingBusinessDays(dueDate){
 if(!dueDate)return null;
 const today=new Date();today.setUTCHours(12,0,0,0);
 const due=new Date(dueDate+"T12:00:00Z");
 if(!Number.isFinite(+due))return null;
 let days=0;
 if(due>=today){for(let d=new Date(today);d<due;){d.setUTCDate(d.getUTCDate()+1);if(d.getUTCDay()!==0&&d.getUTCDay()!==6)days++}}
 else{for(let d=new Date(due);d<today;){d.setUTCDate(d.getUTCDate()+1);if(d.getUTCDay()!==0&&d.getUTCDay()!==6)days--}}
 return due>=today?days:-days;
}

const formatValue=(key,value)=>{
 if(value===null||value===undefined||value==="")return "—";
 if(["total","amount","subtotal","tax","shipping","unit_price"].includes(key))return dollar.format(Number(value));
 if(typeof value==="boolean")return value?"Yes":"No";
 if(key==="due_date"||key.endsWith("_at")){const d=new Date(value);return Number.isNaN(+d)?safe(value):safe(d.toLocaleDateString("en-US",{timeZone:"UTC"}))}
 return safe(value);
};

 target.prepend(el);
}
function fieldInput(field,value,lookup){
 const [name,title,type,required]=field;
 const id="f-"+name;const val=value??"";
 const prefix='<label style="display:block;font-size:12px;font-weight:600;margin:11px 0 5px" for="'+id+'">'+safe(title)+(required?" *":"")+'</label>';
 const common=' id="'+id+'" name="'+name+'" '+(required?"required":"")+' style="width:100%;padding:11px;border:1px solid #d6dfeb;border-radius:8px;background:white;color:#15243a" ';
 if(type==="textarea")return prefix+'<textarea '+common+' rows="3">'+safe(val)+'</textarea>';
 if(type==="checkbox")return prefix+'<input type="checkbox" name="'+name+'" id="'+id+'" '+(val?"checked":"")+' style="width:20px;height:20px">';
 if(type.startsWith("select:")){
 const opts=type.slice(7).split("|");
 return prefix+'<select '+common+'>'+opts.map(x=>'<option value="'+safe(x)+'" '+(x===val?"selected":"")+'>'+safe(x.replaceAll("_"," "))+'</option>').join("")+'</select>';
 }
 if(["customers","orders","estimates"].includes(type)){
 const choices=lookup[type]||[];
 return prefix+'<select '+common+'><option value="">Select...</option>'+choices.map(x=>{
 let label=type==="customers"?(x.company||x.name):(type==="orders"?(x.order_number||x.id):(x.estimate_number||x.id));
 return '<option value="'+safe(x.id)+'" '+(x.id===val?"selected":"")+'>'+safe(label)+'</option>';
 }).join("")+'</select>';
 }
 const number=(type==="number"||type==="integer");
 return prefix+'<input '+common+' type="'+type+'" '+(number?'min="0" step="'+(type==="integer"?"1":"0.01")+'"':"")+' value="'+safe(type==="datetime-local"&&val?String(val).slice(0,16):val)+'">';
}
async function getLookup(){
 const pairs=[["customers","id,name,company"],["orders","id,order_number"],["estimates","id,estimate_number"]];
 const entries=await Promise.all(pairs.map(async ([name,cols])=>{
 const {data,error}=await client.from(name).select(cols).order("created_at",{ascending:false}).limit(500);
 return [name,error?[]:(data||[])];
 }));
 return Object.fromEntries(entries);
}
function closeEditor(){
 const modal=document.getElementById("recordEditor");if(modal)modal.remove();
}
async function showEditor(page,existing){
 const cfg=registry[page];if(!cfg||!cfg.fields.length)return;
 const lookup=await getLookup();
 closeEditor();
 const overlay=document.createElement("div");overlay.id="recordEditor";overlay.style.cssText="position:fixed;inset:0;z-index:200;background:#091a35b5;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto";
 const box=document.createElement("section");box.style.cssText="background:#fff;border-radius:16px;padding:25px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px #091a3535";
 box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:21px;margin:0">'+(existing?"Edit":"Add")+" "+safe(page==="items"?"order item":page==="production"?"production record":page.slice(0,-1))+'</h2><button type="button" id="dismiss" class="btn secondary">Close</button></div>'+
 '<p style="color:#64748b;font-size:13px">All changes are stored in Supabase. Do not mark PayPal payments as verified here.</p>'+
 '<form id="entryForm">'+cfg.fields.map(f=>fieldInput(f,existing?.[f[0]],lookup)).join("")+(page==="artwork"?'<label style="display:block;margin-top:12px;font-weight:bold;font-size:13px">Private artwork file (PNG, JPEG, WebP, PDF; max 20MB)</label><input type="file" id="artworkFile" accept="image/png,image/jpeg,image/webp,application/pdf" style="margin:10px 0;max-width:100%">':'')+
 '<div style="display:flex;gap:9px;margin-top:20px"><button class="btn" type="submit">Save record</button><button class="btn secondary" type="button" id="cancelForm">Cancel</button></div><div id="formMessage" role="status"></div></form>';
 overlay.append(box);document.body.append(overlay);
 const exit=()=>closeEditor();
 box.querySelector("#dismiss").onclick=exit;box.querySelector("#cancelForm").onclick=exit;
 overlay.addEventListener("click",e=>{if(e.target===overlay)exit()});
 box.querySelector("form").onsubmit=async e=>{
 e.preventDefault();const form=e.target;const button=form.querySelector('button[type="submit"]');button.disabled=true;
 const payload={};
 for(const [name,,type,required] of cfg.fields){
 const input=form.elements.namedItem(name);
 let value=type==="checkbox"?input.checked:input.value.trim();
 if(value===""&&!required){if(existing)payload[name]=null;continue}
 if(type==="number"||type==="integer"){value=Number(value);if(!Number.isFinite(value)||value<0||type==="integer"&&!Number.isInteger(value)){alertIn(box,"Invalid numeric value: "+name,true);button.disabled=false;return}}
 if(type==="datetime-local"&&value)value=new Date(value).toISOString();
 payload[name]=value;
 }
 if(page==="production"&&payload.status==="production"&&!payload.production_started_at&&!existing?.production_started_at){
 payload.production_started_at=new Date().toISOString();
  if(!payload.due_date&&!existing?.due_date)payload.due_date=addBusinessDays(new Date(),7);
 }
 let newUploadPath=null;
 if(page==="artwork"){
  const input=form.querySelector("#artworkFile");
  if(input?.files?.length){
   const file=input.files[0];
   if(!["image/png","image/jpeg","image/webp","application/pdf"].includes(file.type)||file.size>20*1024*1024){
    alertIn(box,"Only PNG, JPEG, WebP or PDF files up to 20MB are supported.",true);button.disabled=false;return;
   }
   if(!payload.order_id && !existing?.order_id){alertIn(box,"Select an order before uploading artwork.",true);button.disabled=false;return}
   const folder=payload.order_id||existing.order_id;
   const safeName=file.name.replace(/[^a-zA-Z0-9_.-]/g,"_").slice(-90);
   newUploadPath=folder+"/"+crypto.randomUUID()+"-"+safeName;
   const {error:uploadError}=await client.storage.from("order-artworks").upload(newUploadPath,file,{contentType:file.type,upsert:false});
   if(uploadError){alertIn(box,"Artwork upload failed: "+uploadError.message,true);button.disabled=false;return}
   payload.storage_path=newUploadPath;
  }
 }
 const action=existing?client.from(cfg.table).update(payload).eq("id",existing.id):client.from(cfg.table).insert(payload);
 const {error}=await action;
 if(error){if(newUploadPath)await client.storage.from("order-artworks").remove([newUploadPath]);alertIn(box,"Unable to save: "+error.message,true);button.disabled=false;return}
 closeEditor();loadReadOnlyData(page);
 };

 const revision=++loadRevision;
 if(pageId==="migration"){showMigration();return;}
 if(pageId==="settings"){const el=document.querySelector("#content .placeholder");if(el){el.innerHTML='<div><h3>Integration status</h3><p>Supabase: connected. Resend: SMTP configured in Supabase Auth. PayPal: server-side verification not migrated yet. GitHub Pages: hosting test environment.</p><p>Never paste API secrets into browser code or GitHub.</p><p><a href="https://sr-lhama.github.io/oct-auth-preview/portal.html" target="_blank" rel="noopener">Open customer portal ↗</a></p></div>'}return}
 if(pageId==="overview"){
 const specs=[["orders","Orders"],["estimates","Estimates"],["customers","Customers"],["artworks","Artwork"]];
 const results=await Promise.all(specs.map(async ([table,label])=>{
 const {count,error}=await client.from(table).select("id",{head:true,count:"exact"});
 return {label,count,error};
 }));
 if(revision!==loadRevision||location.hash!=="#overview")return;
 const el=document.querySelector(".stats");if(el)el.innerHTML=results.map(x=>'<div class="stat"><span>'+safe(x.label)+'</span><strong>'+(x.error?"—":String(x.count??0))+'</strong><small>'+(x.error?safe(x.error.message):"Live Supabase total")+'</small></div>').join("");
 return;
 }
 const cfg=registry[pageId];if(!cfg)return;
 const slot=document.querySelector("#content .placeholder");
 if(slot)slot.innerHTML='<div><strong>Loading '+safe(pageId)+'...</strong></div>';
 const {data,error}=await client.from(cfg.table).select("*").order("created_at",{ascending:false}).limit(100);
 if(revision!==loadRevision||location.hash!=="#"+pageId)return;
 const target=document.querySelector("#content .placeholder");if(!target)return;
 target.classList.remove("placeholder");target.style.cssText="display:block;text-align:left;min-height:180px";
 if(error){target.innerHTML='<h3>Access error</h3><p>'+safe(error.message)+'</p>';return}
 const rows=data||[];
 const addable=cfg.fields.length&&pageId!=="production";
 const toolbar='<div style="display:flex;align-items:center;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-bottom:16px"><div><h3 style="margin:0">Supabase records</h3><p style="margin:5px 0">Showing '+rows.length+' most recent records</p></div>'+(addable?'<button id="newEntry" class="btn" type="button">+ New record</button>':"")+'</div>';
 const heads=cfg.columns.map(([k,l])=>'<th>'+safe(l)+'</th>').join("")+'<th>Action</th>';
 const line=rows.map((rec,i)=>'<tr>'+cfg.columns.map(([key])=>{
 let formatted=formatValue(key,rec[key]);
 if(pageId==="production"&&key==="due_date"&&rec.due_date&&!["completed","delivered","cancelled"].includes(rec.status)){
 const remaining=remainingBusinessDays(rec.due_date);
 const color=remaining!==null&&remaining<=3?"#b4233e":"#0f7155";
 formatted+=' <small style="display:block;color:'+color+'">'+(remaining<0?Math.abs(remaining)+' business days overdue':remaining+' business days left')+'</small>';
 }
 return '<td>'+formatted+'</td>';
 }).join("")+'<td>'+(cfg.fields.length?'<button type="button" class="btn secondary editRecord" data-index="'+i+'" style="padding:8px 11px;font-size:12px">Edit</button>':'<span style="color:#64748b">Read only</span>')+'</td></tr>').join("");
 target.innerHTML=toolbar+(rows.length?'<div style="overflow-x:auto"><table class="data-table" style="width:100%;border-collapse:collapse;font-size:13px;text-align:left"><thead><tr>'+heads+'</tr></thead><tbody>'+line+'</tbody></table></div>':'<p>No records yet. The legacy dataset is not present in Supabase.</p>');
 target.querySelectorAll("th,td").forEach(n=>{n.style.padding="12px 10px";n.style.borderBottom="1px solid #e3e9f2"});
 if(addable)target.querySelector("#newEntry").onclick=()=>showEditor(pageId,null);
 target.querySelectorAll(".editRecord").forEach(n=>n.onclick=()=>showEditor(pageId,rows[Number(n.dataset.index)]));
}
function csvEncode(rows){
 if(!rows.length)return "";
 const columns=Object.keys(rows[0]);
 const quote=x=>'"'+String(x??"").replaceAll('"','""')+'"';
 return [columns.map(quote).join(","),...rows.map(row=>columns.map(k=>quote(typeof row[k]==="object"?JSON.stringify(row[k]):row[k])).join(","))].join("\r\n");
}
function downloadFile(filename,contents,type){
 const blob=new Blob([contents],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function showMigration(){
 const el=document.querySelector("#content .placeholder");if(!el)return;
 el.classList.remove("placeholder");el.style.cssText="display:block;text-align:left";
 el.innerHTML='<h3>Export current Supabase data</h3><p>Download an authenticated JSON backup of the new database. This does not export the old ChatGPT Sites database.</p><button id="exportJson" class="btn">Export JSON</button><p id="exportStatus"></p>'+
 '<hr style="margin:25px 0;border:0;border-top:1px solid #e2e8f0"><h3>Legacy migration</h3><p>The previous dashboard is behind OpenAI authentication and cannot be read by this integration. Source records must be obtained first. The migration will preserve customer/order identifiers, artwork associations and payments; no empty records will be substituted.</p>'+
 '<p style="font-size:13px"><strong>Accepted next input:</strong> a JSON or CSV export from the old dashboard, or its original database/API export. Do not upload secrets or payment credentials.</p><a href="https://estimate.sryama.chatgpt.site/dashboard" target="_blank" rel="noopener">Open original dashboard ↗</a>';
 el.querySelector("#exportJson").onclick=async()=>{
  const status=el.querySelector("#exportStatus");status.textContent="Preparing authenticated export...";
  const result={exported_at:new Date().toISOString(),source:"supabase_oct",tables:{}};
  for(const table of ["customers","estimates","orders","order_items","artworks","order_status_history","payments","profiles"]){
   let all=[],from=0,error=null;
   while(true){
    const r=await client.from(table).select("*").range(from,from+499);
    if(r.error){error=r.error;break}
    all.push(...r.data);if(r.data.length<500)break;
    from+=500;if(from>100000){error={message:"Export limit reached"};break}
   }
   if(error){status.textContent="Export cancelled: "+table+" - "+error.message;return}
   result.tables[table]=all;
  }
  downloadFile("oct-supabase-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(result,null,2),"application/json");
  status.textContent="Supabase backup downloaded.";
 };
}
function showGate(title,detail,allowLogin){
 gate.hidden=false;app.hidden=true;
 document.getElementById("gateTitle").textContent=title;
 document.getElementById("gateMessage").textContent=detail;
 document.getElementById("gateLogin").hidden=!allowLogin;
}
async function start(){
 if(!client){showGate("Authentication is unavailable","The Supabase client library could not be loaded.",true);return;}
 try{
 const {data:userData,error:userErr}=await client.auth.getUser();
 if(userErr||!userData.user){showGate("Sign in required","Please sign in with your Orlando Custom Tees account to access administration.",true);return;}
 const {data:profileData,error:profileErr}=await client.from("profiles").select("full_name,role").eq("id",userData.user.id).single();
 if(profileErr||!profileData){showGate("Permission check failed","The administrator profile could not be verified. No business data has been loaded.",false);return;}
 if(profileData.role!=="admin"){showGate("Access restricted","This dashboard is reserved for authorized Orlando Custom Tees administrators.",false);return;}
 currentUser=userData.user;profile=profileData;
 document.getElementById("displayName").textContent=profile.full_name||"Administrator";
 document.getElementById("displayEmail").textContent=currentUser.email||"";
 nav();gate.hidden=true;app.hidden=false;
 showPage((location.hash||"#overview").slice(1));
 }catch(e){console.error("Admin gate error",e);showGate("Unable to verify access","Please try again or sign in again.",true);}
}
document.getElementById("logoutBtn").addEventListener("click",async()=>{document.body.classList.add("busy");try{await client.auth.signOut();location.replace("login.html");}finally{document.body.classList.remove("busy");}});
start();
})();
</script>
