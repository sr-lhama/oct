<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,follow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#83c5ee">
  <title>Page unavailable | Orlando Custom Tees</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/site.css?v=footer-flags">
  <script src="/js/language.js?v=404-2" defer></script>
  <style>
    body.oct-error {
      margin: 0;
      min-height: 100svh;
      background: radial-gradient(ellipse at 50% 48%, #f2f8ff 0, transparent 58%),
        linear-gradient(160deg, #69bae9, #d6eafb 57%, #f1e6f6);
      color: #091a35;
    }
    .oct-error .header { position: static; background: transparent; box-shadow: none; border: 0; }
    .oct-error .header-inner {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: min(100% - 32px, 1320px);
      margin-inline: auto;
      padding: 14px 0;
    }
    .oct-error-logo { width: clamp(125px, 16vw, 200px); height: auto; display: block; }
    .oct-error main { padding: 0 16px 42px; text-align: center; }
    .oct-error-art {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: min(100%, 920px);
      height: clamp(225px, 48vw, 465px);
      margin-inline: auto;
    }
    .oct-error-code {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font: 900 clamp(8rem, 32vw, 27rem)/.85 system-ui, sans-serif;
      letter-spacing: -.065em;
      color: #fff;
      text-shadow: 0 12px 36px #3076ae20;
      user-select: none;
    }
    .oct-error-art img {
      position: absolute;
      inset: 0;
      margin: auto;
      width: min(64%, 390px);
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 16px 18px #13335332);
    }
    .oct-error h1 {
      font-size: clamp(1.8rem, 5vw, 3.35rem);
      line-height: 1.12;
      margin: 8px auto 12px;
    }
    .oct-error main p { max-width: 40ch; margin: 0 auto 24px; color: #344b67; }
    .oct-error main .btn { margin-bottom: 8px; }
    .oct-error-catalog { display: block; width: fit-content; margin: 8px auto 0; text-decoration: underline; }
    .oct-error .header-actions { display: flex; }
    .oct-error .oct-language-links { background: #ffffffb3; border-radius: 9px; padding: 5px; }
    @media (max-width: 420px) {
      .oct-error .header-inner { padding-block: 10px; }
      .oct-error main { padding-bottom: 25px; }
    }
  </style>
</head>
<body class="oct-error">
  <header class="header">
    <div class="header-inner">
      <a href="/" aria-label="Orlando Custom Tees homepage">
        <img class="oct-error-logo" src="/assets/images/logo-official.webp" alt="Orlando Custom Tees">
      </a>
      <div class="header-actions"></div>
    </div>
  </header>
  <main id="main">
    <div class="oct-error-art">
      <span class="oct-error-code" aria-hidden="true">404</span>
      <img src="/assets/page-banners/sr-lhama-lost.webp" alt="" decoding="async" fetchpriority="high">
    </div>
    <h1>We couldn’t find that page</h1>
    <p>Sr. Lhama can help you find your way back.</p>
    <a class="btn btn-pink" href="/">Back to Home</a>
    <a class="oct-error-catalog" href="/apparel.html">Browse Apparel</a>
  </main>
</body>
</html>
